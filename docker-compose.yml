services:
  app:
    build: .
    container_name: pcms-revenue-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # แชร์ Postgres ตัวเดียวกับ Supabase (อีกโปรเจกต์) แต่ใช้ database แยก "pcms_revenue"
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${SUPABASE_POSTGRES_PASSWORD}@host.docker.internal:5432/pcms_revenue}
      SELLER_NAME: ${SELLER_NAME:-บริษัท ชีเฮง จำกัด (สำนักงานใหญ่)}
      SELLER_ADDRESS: ${SELLER_ADDRESS:-3675 ถนนพระรามที่ 4 แขวงพระโขนง เขตคลองเตย กรุงเทพมหานคร 10110}
      SELLER_TAX_ID: ${SELLER_TAX_ID:-0655568002694}
      SELLER_VAT_RATE: ${SELLER_VAT_RATE:-7}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_INITIAL_PASSWORD: ${AUTH_INITIAL_PASSWORD:-}
      AUTH_SEEHENG_PASSWORD: ${AUTH_SEEHENG_PASSWORD:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      # คีย์เข้ารหัส credential ของการเชื่อมต่อแพลตฟอร์ม (base64 32 ไบต์)
      # ถ้าไม่ตั้ง หน้า /platform จะไม่ยอมบันทึก credential ใน production
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:-}
    ports:
      # เปิดเฉพาะ loopback — cloudflared บนเครื่องเซิร์ฟเวอร์ต่อเข้า localhost:3002
      # ห้ามผูก 0.0.0.0 มิฉะนั้นจะเข้าตรงได้ ข้าม WAF และข้ามการล็อก IP ของ Cloudflare
      - "127.0.0.1:3002:3000"

  # Cloudflare Tunnel — เปิดใช้งานด้วย: docker compose --profile tunnel up -d
  # ต้องใส่ CLOUDFLARE_TUNNEL_TOKEN ใน .env (ได้จาก Cloudflare Zero Trust → Tunnels)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pcms-revenue-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

