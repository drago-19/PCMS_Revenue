services:
  app:
    build: .
    container_name: pcms-revenue-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # แชร์ Postgres ตัวเดียวกับ Supabase (อีกโปรเจกต์) แต่ใช้ database แยก "pcms_revenue"
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgrespassword@host.docker.internal:5432/pcms_revenue}
      SELLER_NAME: ${SELLER_NAME:-บริษัท ชีเฮง จำกัด (สำนักงานใหญ่)}
      SELLER_ADDRESS: ${SELLER_ADDRESS:-3675 ถนนพระรามที่ 4 แขวงพระโขนง เขตคลองเตย กรุงเทพมหานคร 10110}
      SELLER_TAX_ID: ${SELLER_TAX_ID:-0655568002694}
      SELLER_VAT_RATE: ${SELLER_VAT_RATE:-7}
    ports:
      - "3001:3000"

  # Cloudflare Tunnel — เปิดใช้งานด้วย: docker compose --profile tunnel up -d
  # ต้องใส่ CLOUDFLARE_TUNNEL_TOKEN ใน .env (ได้จาก Cloudflare Zero Trust → Tunnels)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pcms-revenue-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

  # เปิดดูฐานข้อมูลผ่านเบราว์เซอร์ — docker compose --profile admin up -d
  # เปิด http://localhost:5050 → Add New Server: host=host.docker.internal, port=5432,
  #   db=pcms_revenue, user=postgres, password=postgrespassword
  admin:
    image: dpage/pgadmin4:latest
    container_name: pcms-revenue-pgadmin
    profiles: ["admin"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pcms-revenue.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
