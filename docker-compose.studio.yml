# Supabase Studio ชุดแยกสำหรับ database `pcms_revenue` (แชร์ Postgres ตัวเดียวกับอีกโปรเจกต์)
# เปิดใช้งาน: docker compose -f docker-compose.studio.yml up -d
# แล้วเปิด http://localhost:54324
services:
  revenue-meta:
    image: supabase/postgres-meta:v0.83.2
    container_name: pcms-revenue-meta
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_NAME: pcms_revenue
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: postgrespassword
    networks: [supabase]

  revenue-rest:
    image: postgrest/postgrest:latest
    container_name: pcms-revenue-rest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:postgrespassword@supabase-db:5432/pcms_revenue
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgres
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_EXTRA_SEARCH_PATH: public
    networks: [supabase]

  revenue-proxy:
    image: nginx:alpine
    container_name: pcms-revenue-proxy
    restart: unless-stopped
    volumes:
      - ./docker/studio-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [supabase]

  revenue-studio:
    image: supabase/studio:latest
    container_name: pcms-revenue-studio
    restart: unless-stopped
    environment:
      STUDIO_PG_META_URL: http://revenue-meta:8080
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: pcms_revenue
      POSTGRES_PASSWORD: ${SUPABASE_POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: PCMS_Revenue
      DEFAULT_PROJECT_NAME: PCMS_Revenue
      SUPABASE_URL: http://revenue-proxy:80
      SUPABASE_PUBLIC_URL: http://localhost:54324
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
    ports:
      - "54324:3000"
    networks: [supabase]

networks:
  supabase:
    external: true
    name: pcms-supabase_default
